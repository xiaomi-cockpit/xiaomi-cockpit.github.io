<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found · Xiaomi Cockpit</title>
<meta name="theme-color" content="#0a1621">
<link rel="icon" href="/assets/brand/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/style.css">
<script>
  (function () {
    try {
      var q = /[?&]theme=(light|dark)/.exec(location.search);
      var t = q ? q[1] : localStorage.getItem("cockpit-theme");
      if (t !== "light" && t !== "dark") t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", t);
    } catch (e) {}
  })();
</script>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<main>
  <div class="wrap" style="min-height:100vh;display:grid;place-items:center">
    <div class="glass strong card" style="text-align:center;max-width:520px;padding:40px 28px">
      <p class="tiny">Error 404</p>
      <h2>This page is off the map</h2>
      <p class="dim">The page you were looking for does not exist.</p>
      <p><a class="btn primary" href="/">Back to Xiaomi Cockpit</a></p>
    </div>
  </div>
</main>
<script src="/assets/site.js" defer></script>
</body>
</html>
